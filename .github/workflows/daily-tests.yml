name: Daily engine tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck production source
        run: npm run typecheck
      - name: Run tests and save TAP log
        run: |
          set -o pipefail
          npm test -- --test-reporter=tap | tee test-results.tap
      - name: Store test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results.tap
          if-no-files-found: warn
          retention-days: 90
